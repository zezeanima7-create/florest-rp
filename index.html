<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Floresta RP</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#173b2b;color:#fff;font-family:system-ui,Arial}#game{height:100dvh;display:flex;flex-direction:column}header,#controls{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;background:#10291f;gap:10px}header strong{font-size:17px}button{color:white;background:#315b40;border:1px solid #719778;border-radius:10px;padding:9px 12px;font-weight:700}#view{position:relative;flex:1;min-height:0}canvas{width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none}#hint{position:absolute;top:10px;left:10px;background:#10291dcc;padding:6px 9px;border-radius:8px;font-size:12px}#controls{justify-content:space-between}.pad{display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(2,42px);gap:4px}.pad button{padding:0;font-size:18px;touch-action:none}.up{grid-column:2}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}small{text-align:right;line-height:1.5;color:#c7ddc9}
</style></head><body><main id="game"><header><strong>🌲 Floresta RP</strong><span id="pos">Bosque Verde</span><button id="full">⛶ Tela cheia</button></header><section id="view"><canvas id="c" width="900" height="560"></canvas><div id="hint">Explore a floresta · WASD / setas</div></section><footer id="controls"><div class="pad"><button class="up" data-k="up">▲</button><button class="left" data-k="left">◀</button><button class="down" data-k="down">▼</button><button class="right" data-k="right">▶</button></div><small>Use os botões ou WASD<br>Explore o mapa livremente</small></footer></main>
<script>
(()=>{const c=document.getElementById('c'),g=c.getContext('2d'),W=2400,H=1900;let x=1120,y=950,last=0;const keys=new Set(),trees=[],flowers=[],animals=[];let seed=7342;const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
for(let i=0;i<350;i++){let a=rnd()*W,b=rnd()*H;if(Math.hypot(a-1120,b-950)>125)trees.push({x:a,y:b,r:17+rnd()*18})}for(let i=0;i<500;i++)flowers.push({x:rnd()*W,y:rnd()*H,color:['#ffe28a','#ffb6d1','#fff1d0','#e99b70'][i%4]});for(let i=0;i<25;i++)animals.push({x:200+rnd()*2000,y:180+rnd()*1500,t:rnd()*10,type:i%3});
function dot(a,b,rx,ry,col){g.fillStyle=col;g.beginPath();g.ellipse(a,b,rx,ry,0,0,Math.PI*2);g.fill()}
function draw(){const vw=c.width,vh=c.height,cx=Math.max(0,Math.min(W-vw,x-vw/2)),cy=Math.max(0,Math.min(H-vh,y-vh/2));g.fillStyle='#729a54';g.fillRect(0,0,vw,vh);g.save();g.translate(-cx,-cy);g.fillStyle='#7ca45a';g.fillRect(0,0,W,H);
g.lineCap='round';g.strokeStyle='#c7ad79';g.lineWidth=92;g.beginPath();g.moveTo(0,1500);g.bezierCurveTo(550,1400,650,1050,1120,950);g.bezierCurveTo(1550,850,1750,1200,2400,700);g.stroke();
dot(1660,460,260,175,'#3d91ae');g.strokeStyle='#a0d7d1';g.lineWidth=8;g.beginPath();g.ellipse(1660,460,260,175,-.2,0,Math.PI*2);g.stroke();
for(const p of flowers)dot(p.x,p.y,3,3,p.color);for(let i=0;i<55;i++)dot((i*421)%W,(i*233)%H,8,5,'#929b8b');
for(const t of trees){g.fillStyle='#68452d';g.fillRect(t.x-6,t.y-2,12,t.r+8);dot(t.x,t.y-10,t.r+7,t.r*.83,'#285c37');dot(t.x-9,t.y-19,t.r*.65,t.r*.58,'#397b43');dot(t.x+10,t.y-20,t.r*.55,t.r*.48,'#548c48')}
for(const a of animals){a.t+=.012;a.x+=Math.sin(a.t)*.28;a.y+=Math.cos(a.t*1.3)*.2;let col=a.type===0?'#bb8755':a.type===1?'#eee8d8':'#a9a18a';dot(a.x,a.y,11,7,col);dot(a.x+8,a.y-5,5,5,col);if(a.type===1){g.fillStyle=col;g.fillRect(a.x+3,a.y-17,3,12);g.fillRect(a.x+10,a.y-17,3,12)}}
dot(x,y+11,13,5,'#29442c');dot(x,y-8,8,8,'#e5b28b');dot(x,y-12,8,5,'#54392b');g.fillStyle='#3878b8';g.fillRect(x-8,y,16,15);g.fillStyle='#25364c';g.fillRect(x-7,y+14,5,8);g.fillRect(x+2,y+14,5,8);g.fillStyle='#222';g.fillRect(x-4,y-9,2,2);g.fillRect(x+3,y-9,2,2);g.restore();document.getElementById('pos').textContent='X '+Math.round(x)+' · Y '+Math.round(y)}
function loop(t){let dt=Math.min((t-last)/16.67||1,2);last=t;let dx=0,dy=0;if(keys.has('left'))dx--;if(keys.has('right'))dx++;if(keys.has('up'))dy--;if(keys.has('down'))dy++;if(dx||dy){let n=Math.hypot(dx,dy);x=Math.max(20,Math.min(W-20,x+dx/n*3.8*dt));y=Math.max(20,Math.min(H-20,y+dy/n*3.8*dt))}draw();requestAnimationFrame(loop)}
const map={ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'};window.addEventListener('keydown',e=>{if(map[e.key]){e.preventDefault();keys.add(map[e.key])}});window.addEventListener('keyup',e=>{if(map[e.key])keys.delete(map[e.key])});
document.querySelectorAll('[data-k]').forEach(b=>{let k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();keys.add(k);b.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>keys.delete(k)))});
document.getElementById('full').onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){}};document.addEventListener('fullscreenchange',()=>document.getElementById('full').textContent=document.fullscreenElement?'Sair da tela cheia':'⛶ Tela cheia');requestAnimationFrame(loop)})();
</script></body></html>
